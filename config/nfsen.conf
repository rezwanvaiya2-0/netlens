# =============================================================================
# NfSen configuration file
# Following the working guide exactly
# ALL standard directory variables defined so install.pl knows where to install
# =============================================================================

$BASEDIR = "/var/nfsen";
$HTMLDIR = "/var/nfsen/www";
$BINDIR  = "/var/nfsen/bin";
$LIBEXECDIR = "/var/nfsen/libexec";
$CONFDIR = "/var/nfsen/etc";
$VARDIR  = "/var/nfsen/var";

$DOCDIR               = "${HTMLDIR}/doc";
$PROFILESTATDIR       = "/var/nfsen/profiles-stat";
$PROFILEDATADIR       = "/var/nfsen/profiles-data";
$BACKEND_PLUGINDIR    = "${LIBEXECDIR}/plugins";
$FRONTEND_PLUGINDIR   = "${HTMLDIR}/plugins";

$PREFIX  = '/usr/local/bin';
$USER    = "netflow";
$WWWUSER  = "www-data";
$WWWGROUP = "www-data";

$PROFILERS = 2;

$NFDUMPSRC = '/usr/local/bin/nfdump';
$NFCAPDSRC = '/usr/local/bin/nfcapd';

%sources = (
    # Demo source only - add each real router manually (see README
    # 'Managing Router Sources' / 'Adding a Router on a New Port'):
    #   'name' => { 'port' => '2055', 'IP' => '<router ip>', 'col' => '#0000ff', 'type' => 'netflow' },
    # NfSen requires EVERY source to have an 'IP' field once you have more
    # than one source.
    'router1' => { 'port' => '2055', 'IP' => '0.0.0.0', 'col' => '#0000ff', 'type' => 'netflow' },
);

$unknow_color = '#ff0000';
$enable_leftmenu = 1;
$enable_topmenu = 1;
$enable_statsgraph = 1;

$profiletimout = 60;
$socktype = 'Unix';
$sockfile = '/var/nfsen/var/run/nfsen.comm';
$PIDFile = '/var/nfsen/var/run/nfsend.pid';
$max_channels_page = 0;
$rrdtool = '/usr/bin/rrdtool';
$debug = 0;

1;
