<VirtualHost *:8070>
    ServerAdmin webmaster@localhost
    ServerName nfsen.local
    DocumentRoot /var/nfsen/www
    DirectoryIndex nfsen.php

    # =========================================================================
    # Password protection — styled HTML login page (Apache mod_auth_form).
    #
    # Every request under /var/nfsen/www requires a valid login, checked
    # against /var/nfsen/etc/.htpasswd (seeded by the entrypoint with a
    # default admin user on first boot). Unauthenticated requests get an
    # HTTP 401 whose body is the login page (inline login): the form POSTs
    # back to /nfsen.php, where mod_auth_form validates the credentials and
    # issues a session cookie. login.php and /logout are exempt so the
    # login / logout flow can work without a session.
    #
    # Change the password any time (takes effect instantly, no restart):
    #   docker exec netlens htpasswd -b /var/nfsen/etc/.htpasswd admin <newpass>
    # =========================================================================
    <Directory /var/nfsen/www>
        # Security: no directory listings (Indexes off) - NfSen folders contain
        # plugin source / config files that should not be browsable.
        Options -Indexes +FollowSymLinks
        AllowOverride All

        AuthType form
        AuthName "NfSen Login"
        AuthFormProvider file
        AuthUserFile /var/nfsen/etc/.htpasswd
        Session On
        SessionCookieName nfsen_session path=/
        # NOTE: the Apache session cookie cannot be marked HttpOnly here -
        # Ubuntu 20.04 ships Apache 2.4.41, and cookie attributes on the
        # session cookie (HttpOnly/Secure/SameSite) need Apache 2.4.43+.
        # The PHP-side activity-timer cookie IS HttpOnly + SameSite=Lax
        # (session-guard.php), and HTTPS in front of the UI is recommended
        # (see README "Security").
        # NOTE: no SessionMaxAge here — the cookie must stay a SESSION cookie
        # (no Max-Age) so it is deleted when the browser closes and the next
        # visit shows the login page again. The 1-hour auto-logout is enforced
        # in PHP by session-guard.php (auto_prepend_file below).
        # Placeholder - replaced with a random passphrase by the entrypoint on
        # first start (must be 32+ bytes for mod_session_crypto).
        SessionCryptoPassphrase "NFSEN_SESSION_CRYPTO_CHANGE_ME_PLACEHOLDER_0123456789"
        Require valid-user
        ErrorDocument 401 /login.php

        # The login page (and the /logout handler URL) must stay reachable
        # without a session, otherwise 401 → login → 401 would loop forever.
        <FilesMatch "^(login\.php|logout)$">
            Require all granted
        </FilesMatch>
    </Directory>

    # Logout: visiting /logout clears the login session and returns the user
    # to the login page.
    <Location "/logout">
        SetHandler form-logout-handler
        AuthName "NfSen Login"
        AuthFormLogoutLocation "/login.php?loggedout=1"
        Session On
        SessionCookieName nfsen_session path=/
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <IfModule mod_php7.c>
        php_admin_value date.timezone "Asia/Dhaka"
        php_admin_value upload_max_filesize "100M"
        php_admin_value post_max_size "100M"
        php_admin_value max_execution_time 300
        php_admin_value memory_limit "256M"
        # Runs session-guard.php before every PHP page: it enforces the 1-hour
        # auto-logout (the Apache session cookie itself dies on browser close).
        php_admin_value auto_prepend_file "/var/nfsen/www/session-guard.php"
    </IfModule>
</VirtualHost>
